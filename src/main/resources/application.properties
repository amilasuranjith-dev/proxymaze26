server.port=${PORT:8080}

# Serialize Instant as "2026-04-24T10:15:30Z" (ISO 8601 UTC), not as a number
spring.jackson.serialization.write-dates-as-timestamps=false

# Always include null fields in JSON output (e.g., resolved_at: null)
spring.jackson.default-property-inclusion=always

# Auto-convert Java camelCase to JSON snake_case
# checkIntervalSeconds -> check_interval_seconds
spring.jackson.property-naming-strategy=SNAKE_CASE

# CRITICAL: Never fail on unknown JSON fields in requests
spring.jackson.deserialization.fail-on-unknown-properties=false
